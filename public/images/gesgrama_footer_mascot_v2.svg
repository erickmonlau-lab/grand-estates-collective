    <path d="M 210 215 L 230 215 L 232 250 L 208 250 Z" fill="#ffffff" />
    <path d="M 208 235 C 215 242 225 242 232 235" stroke="#22345c" stroke-width="2" stroke-linecap="round" />

    <!-- Head / Face Contour -->
    <path d="M 200 170 C 200 135 240 135 240 170 C 240 195 235 220 220 224 C 205 220 200 195 200 170 Z" fill="#ffffff" />
    <path d="M 197 175 C 195 170 195 185 198 188 C 200 190 202 185 201 178" fill="#ffffff" stroke="#22345c" stroke-width="1.5" /> <!-- Ear -->
    <path d="M 239 175 C 241 170 241 185 238 188 C 236 190 234 185 235 178" fill="#ffffff" stroke="#22345c" stroke-width="1.5" /> <!-- Ear Right -->

    <!-- Refined Facial Features: Eyebrows, Eyes, Smile, Nose (Requirement 1) -->
    <!-- Confident expressive eyebrows -->
    <path d="M 206 168 C 210 165 215 166 218 169" stroke="#0f1729" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 224 169 C 227 166 232 165 236 168" stroke="#0f1729" stroke-width="2.5" stroke-linecap="round" />

    <!-- Eyes (Clean geometric & friendly) -->
    <circle cx="212" cy="176" r="2.8" fill="#0f1729" />
    <circle cx="230" cy="176" r="2.8" fill="#0f1729" />
    <circle cx="213" cy="175" r="0.9" fill="#ffffff" />
    <circle cx="231" cy="175" r="0.9" fill="#ffffff" />

    <!-- Nose & Warm Smile -->
    <path d="M 221 176 L 220 186 L 224 187" stroke="#22345c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 213 195 C 218 202 225 202 229 195" stroke="#2f6bff" stroke-width="2.5" stroke-linecap="round" />

