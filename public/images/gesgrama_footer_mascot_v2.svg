    <path d="M 265 295 L 228 375 L 230 430 L 275 425 Z" fill="#18233d" />
    <!-- Lapel Lines -->
    <path d="M 185 275 L 210 365 L 175 305 Z" fill="#0f1729" />
    <path d="M 255 275 L 230 365 L 265 305 Z" fill="#22345c" />

    <!-- Pocket Square in Brand Blue -->
    <path d="M 172 340 L 192 338 L 190 344 L 170 345 Z" fill="#0f1729" />
    <polygon points="176,338 181,328 186,338" fill="#2f6bff" />

    <!-- Advisor Right Arm (Extending naturally forward presenting the house - Requirement 3) -->
    <path d="M 270 305 C 290 320 310 340 315 365 C 318 378 305 385 292 380 C 275 372 260 355 250 335 Z" fill="#22345c" />
    <path d="M 275 340 C 285 352 295 360 305 362" stroke="#0f1729" stroke-width="3" stroke-linecap="round" />

