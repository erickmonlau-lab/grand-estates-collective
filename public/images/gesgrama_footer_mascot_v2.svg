  <!-- ── 5. ANCHORED BADGES (Requirement 5: Bien ancladas al círculo de fondo) ── -->
  <g id="anchored-badges">
    <!-- BADGE 1: AICAT nº 5583 (Anclada al borde inferior izquierdo con conector sólido) -->
    <g id="badge-aicat" transform="translate(65, 360)">
      <!-- Structural Anchor Bracket connecting to outer circle -->
      <path d="M 25 40 L -15 65 L -5 85 L 35 60 Z" fill="#22345c" />
      <line x1="-15" y1="65" x2="35" y2="60" stroke="#2f6bff" stroke-width="3" stroke-linecap="round" />

      <!-- Main Badge Capsule -->
      <rect x="10" y="10" width="130" height="64" rx="32" fill="#0f1729" stroke="#2f6bff" stroke-width="3.5" />
      <circle cx="42" cy="42" r="22" fill="#2f6bff" />

      <!-- AICAT Emblem Icon (Check/Shield) -->
      <path d="M 34 42 L 40 48 L 51 37" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

      <!-- Badge Typography -->
      <text x="74" y="36" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="900" letter-spacing="1">AICAT</text>
      <text x="74" y="52" fill="#2f6bff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="800" letter-spacing="0.5">Nº 5583</text>
    </g>

    <!-- BADGE 2: +15 AÑOS / ANYS EXPERIENCIA (Anclada al borde superior derecho) -->
    <g id="badge-experiencia" transform="translate(415, 110)">
      <!-- Structural Anchor Bracket connecting to outer circle -->
      <path d="M 50 70 L 85 40 L 105 55 L 70 85 Z" fill="#22345c" />
      <line x1="85" y1="40" x2="70" y2="85" stroke="#2f6bff" stroke-width="3" stroke-linecap="round" />

      <!-- Main Badge Circle with Accent Rings -->
      <circle cx="65" cy="65" r="48" fill="#18233d" stroke="#2f6bff" stroke-width="4" />
      <circle cx="65" cy="65" r="42" stroke="#22345c" stroke-width="2" stroke-dasharray="6 4" />

      <!-- Inner Badge Graphic -->
      <!-- Star Icon on top -->
      <polygon points="65,28 68,36 76,36 70,41 72,49 65,44 58,49 60,41 54,36 62,36" fill="#2f6bff" />

      <!-- Badge Text -->
      <text x="65" y="68" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="900" text-anchor="middle" letter-spacing="-0.5">+15</text>
      <text x="65" y="84" fill="#2f6bff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="800" text-anchor="middle" letter-spacing="1.5">AÑOS</text>
      <text x="65" y="96" fill="#ffffff" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="8" font-weight="700" text-anchor="middle" letter-spacing="0.5">EXPERIENCIA</text>
    </g>
  </g>

  <!-- ── 6. GEOMETRIC ACCENTS & HIGHLIGHTS ── -->
  <g id="accents">
    <!-- Star Sparkle 1 (Top Left) -->
    <circle cx="150" cy="190" r="3" fill="#2f6bff" />
    <path d="M 150 182 L 150 198 M 142 190 L 158 190" stroke="#2f6bff" stroke-width="1.5" stroke-linecap="round" />

    <!-- Star Sparkle 2 (Center High) -->
    <circle cx="300" cy="130" r="2.5" fill="#ffffff" opacity="0.8" />
    <path d="M 300 124 L 300 136 M 294 130 L 306 130" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.8" />

    <!-- Star Sparkle 3 (Bottom Right) -->
    <circle cx="490" cy="380" r="3" fill="#2f6bff" />
    <path d="M 490 373 L 490 387 M 483 380 L 497 380" stroke="#2f6bff" stroke-width="1.5" stroke-linecap="round" />
