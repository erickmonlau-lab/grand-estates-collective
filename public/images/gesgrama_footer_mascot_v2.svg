    <path d="M 385 270 L 420 270 L 415 330 L 390 330 Z" fill="#2f6bff" /> <!-- Inner Blue Top -->
    <polygon points="390,270 405,305 400,270" fill="#ffffff" />
    <polygon points="415,270 405,305 410,270" fill="#ffffff" />

    <!-- Jacket Folds / Structure -->
    <path d="M 365 320 L 392 390 L 380 425 L 358 420 Z" fill="#18233d" />
    <path d="M 445 320 L 420 390 L 430 425 L 452 420 Z" fill="#0f1729" />
    <path d="M 438 355 C 445 365 450 380 446 395" stroke="#18233d" stroke-width="2.5" stroke-linecap="round" />

