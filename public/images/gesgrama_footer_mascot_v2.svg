    <path d="M 198 168 C 196 142 205 125 222 125 C 242 125 246 140 244 158 C 238 152 230 152 220 150 C 210 148 202 158 198 168 Z" fill="#0f1729" />
    <path d="M 220 125 C 235 125 245 132 245 148 C 240 142 232 140 224 142 Z" fill="#22345c" />
    <path d="M 199 162 C 202 155 208 152 215 152 C 212 156 208 158 202 165" stroke="#2f6bff" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- ── 3. HERO PROP: CASA & LLAVE FLOTANTE (Centro) ── -->
  <g id="prop-casa-llaves">
    <!-- Glowing Pedestal / Glow Circle -->
    <ellipse cx="320" cy="355" rx="38" ry="10" fill="#22345c" opacity="0.6" />

    <!-- Stylized Miniature Modern House -->
    <!-- Base Walls -->
    <polygon points="300,345 340,345 340,305 300,305" fill="#ffffff" />
    <!-- House Side Wall (3D Depth) -->
    <polygon points="340,345 355,335 355,298 340,305" fill="#e2e8f0" />

    <!-- Brand Blue Roof -->
    <polygon points="292,305 320,278 348,305" fill="#2f6bff" />
    <polygon points="320,278 360,272 355,298 348,305" fill="#22345c" />

    <!-- Chimney -->
    <polygon points="334,282 342,282 342,295 334,295" fill="#0f1729" />

    <!-- Door & Windows -->
    <rect x="314" y="322" width="12" height="23" rx="2" fill="#0f1729" />
    <rect x="304" y="312" width="8" height="8" rx="1" fill="#2f6bff" />
    <rect x="345" y="310" width="6" height="10" rx="1" fill="#2f6bff" />

    <!-- Sparkling House Heart / Star -->
    <circle cx="320" cy="265" r="4" fill="#ffffff" />
    <path d="M 320 257 L 320 273 M 312 265 L 328 265" stroke="#2f6bff" stroke-width="2" stroke-linecap="round" />

    <!-- Floating Keychain & Key (Being Handed to Client - Requirement 4) -->
    <g id="key-transfer">
      <!-- House-shaped Key Tag -->
      <path d="M 358 342 L 366 335 L 374 342 L 374 354 L 358 354 Z" fill="#2f6bff" />
      <circle cx="366" cy="344" r="2" fill="#ffffff" />
      <!-- Golden / Blue Key -->
      <path d="M 366 354 L 366 372 L 372 372 M 366 366 L 370 366" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <!-- Dynamic Motion Arcs -->
      <path d="M 345 330 C 360 320 375 325 385 340" stroke="#2f6bff" stroke-width="2" stroke-dasharray="4 3" stroke-linecap="round" />
    </g>
  </g>

  <!-- ── 4. FIGURE 2: CLIENTE FELIZ RECIBIENDO LLAVES (Derecha - Requirement 4) ── -->
  <g id="cliente-comprador">
    <!-- Shadow beneath Client -->
    <ellipse cx="400" cy="455" rx="65" ry="12" fill="#0f1729" opacity="0.8" />

    <!-- Legs / Trousers -->
    <path d="M 370 420 L 375 490 L 405 490 L 398 420 Z" fill="#18233d" />
    <path d="M 406 420 L 412 490 L 440 490 L 432 420 Z" fill="#0f1729" />

