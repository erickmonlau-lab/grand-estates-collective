<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%" fill="none">
  <!-- PALETTE DEFINITION:
       Navy Dark:   #0f1729
       Navy Medium: #18233d
       Navy Light:  #22345c
       Brand Blue:  #2f6bff
       Highlights:  #ffffff
  -->

  <!-- ── 1. BACKGROUND DISK & ARCHITECTURAL ANCHOR ── -->
  <g id="background-base">
