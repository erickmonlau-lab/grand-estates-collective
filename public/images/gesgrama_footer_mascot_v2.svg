    <!-- Torso / Jacket Base -->
    <path d="M 155 310 C 155 260 280 260 285 310 L 290 425 C 290 435 150 435 150 425 Z" fill="#18233d" />

    <!-- Jacket Folds, Shading & Contours (Requirement 2) -->
    <!-- Left Shoulder & Arm -->
    <path d="M 155 310 C 140 330 135 375 145 415 C 150 435 175 435 180 415 L 180 340 Z" fill="#0f1729" />
    <!-- Arm Crease Highlight / Shadow -->
    <path d="M 148 375 C 155 385 168 390 178 382" stroke="#22345c" stroke-width="3" stroke-linecap="round" />
    <path d="M 142 345 C 148 355 158 358 165 352" stroke="#22345c" stroke-width="2.5" stroke-linecap="round" />

