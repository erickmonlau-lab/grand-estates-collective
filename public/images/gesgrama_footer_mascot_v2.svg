    <!-- Reaching Open Palm -->
    <path d="M 368 375 C 372 372 382 370 388 365 C 392 362 394 366 390 372 L 376 382 Z" fill="#ffffff" />
    <circle cx="382" cy="368" r="3.5" fill="#2f6bff" opacity="0.3" />

    <!-- Client Right Arm (Expressive, near heart) -->
    <path d="M 445 325 C 455 345 450 375 435 390 C 428 395 420 388 422 380 L 432 340 Z" fill="#18233d" />
    <path d="M 422 380 C 418 382 414 378 416 372 C 418 368 425 368 428 375 Z" fill="#ffffff" />

    <!-- Client Head & Neck -->
    <path d="M 395 245 L 415 245 L 415 275 L 395 275 Z" fill="#ffffff" />
    <path d="M 395 258 C 402 264 410 264 415 258" stroke="#22345c" stroke-width="2" stroke-linecap="round" />

    <!-- Head / Face Contour -->
    <path d="M 388 185 C 388 150 425 150 425 185 C 425 210 420 230 406 235 C 394 230 388 210 388 185 Z" fill="#ffffff" />
    <path d="M 385 190 C 383 185 383 200 386 202 C 388 204 390 198 389 192" fill="#ffffff" stroke="#22345c" stroke-width="1.5" /> <!-- Ear -->
    <path d="M 425 190 C 427 185 427 200 424 202 C 422 204 420 198 421 192" fill="#ffffff" stroke="#22345c" stroke-width="1.5" /> <!-- Ear -->

    <!-- Refined Joyful Facial Features (Requirement 1 & 4) -->
    <!-- Expressive eyebrows -->
    <path d="M 393 182 C 397 178 402 178 405 182" stroke="#0f1729" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 410 182 C 413 178 418 178 421 182" stroke="#0f1729" stroke-width="2.5" stroke-linecap="round" />

    <!-- Happy Eyes (Smiling Arcs) -->
    <path d="M 394 190 C 397 186 402 186 404 190" stroke="#0f1729" stroke-width="2.8" stroke-linecap="round" />
    <path d="M 411 190 C 414 186 419 186 421 190" stroke="#0f1729" stroke-width="2.8" stroke-linecap="round" />

    <!-- Joyful Smile & Cheeks -->
    <path d="M 403 190 L 402 198 L 406 199" stroke="#22345c" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 396 206 C 402 216 412 216 418 206" stroke="#2f6bff" stroke-width="3" stroke-linecap="round" />
    <circle cx="393" cy="202" r="3" fill="#2f6bff" opacity="0.15" />
    <circle cx="421" cy="202" r="3" fill="#2f6bff" opacity="0.15" />

    <!-- Stylish Hair with Volume & Flow (Requirement 1) -->
    <path d="M 386 182 C 382 150 395 135 412 135 C 430 135 435 152 432 175 C 428 168 420 162 408 162 C 398 162 390 170 386 182 Z" fill="#0f1729" />
    <path d="M 425 142 C 435 155 438 180 435 205 C 430 195 428 175 428 165 Z" fill="#18233d" />
    <path d="M 386 180 C 384 195 382 215 378 225 C 382 210 386 195 388 185 Z" fill="#22345c" />
    <path d="M 402 136 C 415 138 424 145 428 155" stroke="#2f6bff" stroke-width="2.5" stroke-linecap="round" />
