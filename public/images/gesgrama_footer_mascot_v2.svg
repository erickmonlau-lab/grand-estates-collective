    <circle cx="300" cy="300" r="270" fill="#0f1729" />
    <circle cx="300" cy="300" r="266" stroke="#22345c" stroke-width="4" stroke-dasharray="12 6" />
    <circle cx="300" cy="300" r="248" fill="#18233d" />

    <!-- Architectural Background Silhouette (Santa Coloma / Mediterranean city accents) -->
    <path d="M 120 420 L 120 280 L 165 250 L 210 280 L 210 420 Z" fill="#22345c" opacity="0.4" />
    <rect x="140" y="270" width="16" height="24" rx="2" fill="#18233d" opacity="0.6" />
    <rect x="174" y="270" width="16" height="24" rx="2" fill="#18233d" opacity="0.6" />
    <rect x="140" y="310" width="16" height="24" rx="2" fill="#18233d" opacity="0.6" />
    <rect x="174" y="310" width="16" height="24" rx="2" fill="#18233d" opacity="0.6" />

    <!-- Central Minimal Modern Arch -->
    <path d="M 230 420 L 230 210 C 230 170 370 170 370 210 L 370 420 Z" fill="#22345c" opacity="0.3" />
    <path d="M 250 420 L 250 220 C 250 190 350 190 350 220 L 350 420 Z" fill="#18233d" opacity="0.5" />

    <!-- Right Side Modern Building Silhouette -->
    <path d="M 390 420 L 390 260 L 480 260 L 480 420 Z" fill="#22345c" opacity="0.4" />
    <rect x="410" y="280" width="22" height="14" rx="1" fill="#18233d" opacity="0.6" />
    <rect x="445" y="280" width="22" height="14" rx="1" fill="#18233d" opacity="0.6" />
    <rect x="410" y="310" width="22" height="14" rx="1" fill="#18233d" opacity="0.6" />
    <rect x="445" y="310" width="22" height="14" rx="1" fill="#18233d" opacity="0.6" />

    <!-- Soft Base Horizon Ground -->
    <path d="M 60 450 Q 300 480 540 450 L 540 570 L 60 570 Z" fill="#0f1729" />
    <path d="M 80 440 Q 300 465 520 440" stroke="#2f6bff" stroke-width="3" stroke-linecap="round" opacity="0.7" />
  </g>

  <!-- ── 2. FIGURE 1: EL ASESOR INMOBILIARIO (Izquierda) ── -->
  <g id="asesor-inmobiliario">
